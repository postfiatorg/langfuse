# fly.toml app configuration file for langfuse-api (worker/backend)
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'langfuse-api'
primary_region = 'iad'

[build]
  dockerfile = 'worker/Dockerfile'

[http_service]
  internal_port = 3030
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[env]
  NODE_ENV = 'production'
  PORT = '3030'

[[vm]]
  memory = '4gb'
  cpu_kind = 'performance'
  cpus = 2

# Health checks for the API service
[checks]
  [checks.api_health]
    type = "http"
    grace_period = "60s"
    interval = "20s"
    method = "GET"
    timeout = "10s"
    path = "/api/health"

